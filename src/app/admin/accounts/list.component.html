<h1>Users</h1>
<a routerLink="/admin/accounts/add" class="btn btn-sm btn-success mb-2">Add User</a>
<table class="table table-striped">
  <thead>
    <tr>
      <th style="width: 30%">Name</th>
      <th style="width: 30%">Email</th>
      <th style="width: 20%">Role</th>
      <th style="width: 20%"></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let account of accounts">
      <td>{{account.title}} {{account.firstName}} {{account.lastName}}</td>
      <td>{{account.email}}</td>
      <td>{{account.role}}</td>
      <td style="white-space: nowrap">
        <a routerLink="/admin/accounts/edit/{{account.id}}" class="btn btn-sm btn-primary me-1">Edit</a>
        <button (click)="deleteAccount(account.id)" [disabled]="account.isDeleting" class="btn btn-sm btn-danger btn-delete-account" [ngClass]="{'disabled': account.isDeleting}">
          <span *ngIf="account.isDeleting" class="spinner-border spinner-border-sm"></span>
          <span *ngIf="!account.isDeleting">Delete</span>
        </button>
      </td>
    </tr>
    <tr *ngIf="!accounts">
      <td colspan="4" class="text-center">
        <span class="spinner-border spinner-border-lg align-center"></span>
      </td>
    </tr>
  </tbody>
</table>
